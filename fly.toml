# Fly.io · one-click deploy
# Usage: fly launch --copy-config --name gridwise-2-0
app = "gridwise-2-0"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  ENV = "production"
  DEBUG = "false"
  LLM_PROVIDER = "gemini"
  GEMINI_MODEL = "gemini-3-flash-preview"
  LLM_TIMEOUT_SECONDS = "12.0"
  SOLVER_TIMEOUT_SECONDS = "5.0"
  TOTAL_TIMEOUT_SECONDS = "28.0"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Required secrets (set with: fly secrets set GEMINI_API_KEY=...)
#   GEMINI_API_KEY
